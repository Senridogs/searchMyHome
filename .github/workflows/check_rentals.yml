name: 賃貸物件チェック

on:
  schedule:
    # 毎日JST 18:00 (UTC 9:00) に実行
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run rental check
        id: check
        continue-on-error: true
        run: python3 check_rentals.py

      - name: Create GitHub Issue if new listings found
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "新着物件" --color "1d76db" --description "新着賃貸物件" 2>/dev/null || true
          TITLE="🏠 新着物件レポート $(date +'%Y-%m-%d')"
          BODY=$(cat data/report.md)
          gh issue create --title "$TITLE" --body "$BODY" --label "新着物件"

      - name: Send LINE notification (new listings)
        if: steps.check.outcome == 'success' && vars.LINE_CHANNEL_ACCESS_TOKEN != ''
        env:
          LINE_TOKEN: ${{ vars.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ vars.LINE_USER_ID }}
        run: |
          COUNT=$(grep -oP '新着 \K\d+' data/report.md || echo "0")
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -d "{
              \"to\": \"${LINE_USER_ID}\",
              \"messages\": [{
                \"type\": \"text\",
                \"text\": \"🏠 新着物件 ${COUNT}件あります！\n\n詳細はGitHub Issueを確認:\nhttps://github.com/${{ github.repository }}/issues\"
              }]
            }"

      - name: Send LINE notification (no new listings)
        if: steps.check.outcome == 'failure' && vars.LINE_CHANNEL_ACCESS_TOKEN != ''
        env:
          LINE_TOKEN: ${{ vars.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ vars.LINE_USER_ID }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -d "{
              \"to\": \"${LINE_USER_ID}\",
              \"messages\": [{
                \"type\": \"text\",
                \"text\": \"🏠 本日の新着物件はありませんでした。\"
              }]
            }"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/previous.json
          git diff --staged --quiet || git commit -m "Update rental data $(date +'%Y-%m-%d')"
          git push
