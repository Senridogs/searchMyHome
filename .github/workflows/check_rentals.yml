name: 賃貸物件チェック

on:
  schedule:
    # 毎日JST 9:00 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run rental check
        id: check
        continue-on-error: true
        run: python3 check_rentals.py

      - name: Create GitHub Issue if new listings found
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🏠 新着物件レポート $(date +'%Y-%m-%d')"
          BODY=$(cat data/report.md)
          gh issue create --title "$TITLE" --body "$BODY" --label "新着物件"

      - name: Send LINE notification
        if: steps.check.outcome == 'success' && vars.LINE_NOTIFY_TOKEN != ''
        env:
          LINE_TOKEN: ${{ vars.LINE_NOTIFY_TOKEN }}
        run: |
          # Extract count from report
          COUNT=$(grep -oP '新着 \K\d+' data/report.md || echo "0")
          MSG=$(printf "\n🏠 新着物件 ${COUNT}件\n\n詳細はGitHub Issueを確認:\nhttps://github.com/${{ github.repository }}/issues")
          curl -s -X POST https://notify-api.line.me/api/notify \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -F "message=${MSG}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/previous.json
          git diff --staged --quiet || git commit -m "Update rental data $(date +'%Y-%m-%d')"
          git push
