name: 賃貸物件チェック

on:
  schedule:
    # 毎日JST 17:00 (UTC 8:00) に収集。17:50 の Claude ルーチンが整理し、notify.yml が LINE に送る
    - cron: '0 8 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run rental check
        id: check
        continue-on-error: true
        run: python3 check_rentals.py

      - name: Send LINE notification (no new listings)
        if: steps.check.outcome == 'failure' && vars.LINE_CHANNEL_ACCESS_TOKEN != ''
        env:
          LINE_TOKEN: ${{ vars.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ vars.LINE_GROUP_ID }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -d "{
              \"to\": \"${LINE_GROUP_ID}\",
              \"messages\": [{
                \"type\": \"text\",
                \"text\": \"🏠 本日の新着物件はありませんでした。\"
              }]
            }"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/seen_history.json data/pending.json
          git diff --staged --quiet || git commit -m "Update rental data $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
